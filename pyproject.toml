[project]
name = "textual-serve-xman-only"
version = "1.1.2rc1"
description = "A custom fork of textual-serve for Crossman only. Other use cases will not be supported by this fork. Please use the upstream packages accordingly."
authors = [
    { name = "Will McGugan" }
]
maintainers = [
  { name = "Chai Chaoweeraprasit / Crossman", email = "jaywee1115@gmail.com" }
]
dependencies = [
    "aiohttp>=3.9.5",
    "aiohttp-jinja2>=1.6",
    "jinja2>=3.1.4",
    "rich",
    "textual>=0.66.0",
]
readme = "README.md"
requires-python = ">= 3.9"
license = { file = "LICENSE" }

[project.urls]
Homepage = "https://github.com/wchao1115/textual-serve"
Source = "https://github.com/wchao1115/textual-serve"
Issues = "https://github.com/wchao1115/textual-serve/issues"
Upstream = "https://github.com/Textualize/textual-serve"

[build-system]
requires = ["hatchling>=1.26.1"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.rye]
managed = true
dev-dependencies = [
    "httpx",
    # required to run the dictionary example
    "textual-dev>=1.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/textual_serve"]
